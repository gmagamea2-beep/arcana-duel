# 빠른 점검: 커밋 메시지에 [quick] 이나 [ai-tune] 이 있을 때만 돈다 (빌드·릴리스 없음).
# [quick]: 규칙 테스트 + 시뮬레이션, [ai-tune]: 거기에 AI 대결까지.
name: AI tune

on:
  push:
    branches: [main, ccr-4c407fa2-hrzdcb]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  duel:
    if: ${{ contains(github.event.head_commit.message, '[ai-tune]') || contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Rules tests + simulation
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | grep -A2 -E "SCRIPT ERROR|Parse Error" | head -40 || true
          for f in core/player_state.gd core/game.gd ai/simple_ai.gd ui/battle.gd ui/main.gd net/net_match.gd; do
            echo "== $f"; ~/godot/godot --headless --path . --check-only --script res://$f 2>&1 | grep -v "^Godot Engine\|^$" | head -20 || true
          done
          ~/godot/godot --headless --path . -s res://tests/rules_test.gd 2>&1 | grep -A1 -E "규칙 테스트|SCRIPT ERROR|Parse Error|ERROR" | head -60 || true
          timeout 600 ~/godot/godot --headless --path . -s res://tests/ui_smoke.gd 2>&1 | grep -A2 -E "UI |SCRIPT ERROR|Parse Error" | head -60 || true
          ~/godot/godot --headless --path . -s res://tests/sim.gd -- 100 2>&1 | grep -E "시뮬레이션|선공|다인전|난이도 점검|SCRIPT ERROR|Parse Error|행동 실패" | head -40 || true
      - name: AI duels
        if: ${{ contains(github.event.head_commit.message, '[ai-tune]') }}
        run: |
          for pair in "2 1 120" "1 0 60" "2 0 60"; do
            ~/godot/godot --headless --path . -s res://tests/ai_duel.gd -- $pair 2>&1 | grep -E "AI 대결|SCRIPT ERROR|행동 실패"
          done
