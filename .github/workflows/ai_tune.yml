# AI 난이도 조정용 빠른 점검: 커밋 메시지에 [ai-tune] 이 있을 때만 돈다 (빌드·릴리스 없음).
name: AI tune

on:
  push:
    branches: [main, ccr-4c407fa2-hrzdcb]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  duel:
    if: ${{ contains(github.event.head_commit.message, '[ai-tune]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: AI duels
        run: |
          ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
          for pair in "2 1 120" "1 0 60" "2 0 60"; do
            ~/godot/godot --headless --path . -s res://tests/ai_duel.gd -- $pair 2>&1 | grep -E "AI 대결|SCRIPT ERROR|행동 실패"
          done
