# 아르카나 듀얼 빌드: AI 자동 대전으로 규칙을 검사한 뒤 Windows .exe 와 Android .apk 를 만든다.
# GitHub 서버에서 실행되며, 공개 저장소는 무료다.
# 결과물은 실행 화면의 Artifacts 와 Releases(알파 빌드)에 올라간다.
name: Build EXE + APK

on:
  push:
    branches: [main, ccr-4c407fa2-hrzdcb]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[ai-tune]') && !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project (script check)
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Rules test (AI vs AI simulation)
        run: |
          ~/godot/godot --headless --path . -s res://tests/sim.gd -- 300 2>&1 | tee sim.log
          if grep -E "SCRIPT ERROR|Parse Error|행동 실패:" sim.log; then exit 1; fi

      - name: Rules unit tests
        run: |
          ~/godot/godot --headless --path . -s res://tests/rules_test.gd 2>&1 | tee rules.log
          if grep -E "SCRIPT ERROR|Parse Error|규칙 테스트 실패" rules.log; then exit 1; fi
          grep "규칙 테스트:" rules.log

      - name: UI test (play one game through the UI, screenshots)
        run: |
          mkdir -p shots && touch shots/.gdignore
          SHOT_DIR=$PWD/shots timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --path . --rendering-driver opengl3 --resolution 1920x1080 -s res://tests/ui_smoke.gd 2>&1 | tee ui.log
          if grep -E "SCRIPT ERROR|Parse Error|UI 행동 실패" ui.log; then exit 1; fi
          grep "UI 점검 완료" ui.log
          ls -la shots

      - name: Online test (two clients via public server)
        continue-on-error: true
        run: |
          timeout 600 ~/godot/godot --headless --path . -s res://tests/online_test.gd 2>&1 | tee online.log
          if grep -E "SCRIPT ERROR|Parse Error" online.log; then exit 1; fi
          grep "온라인 점검: 성공" online.log

      - name: Stamp build number (자동 업데이트용 버전)
        run: |
          python3 - <<'PY'
          import json, os
          p = "data/version.json"
          v = json.load(open(p))
          v["build"] = int(os.environ["GITHUB_RUN_NUMBER"])
          v["engine"] = os.environ["GODOT_VERSION"]
          json.dump(v, open(p, "w"))
          print(v)
          PY
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          sed -i "s/^application\/file_version=.*/application\/file_version=\"0.1.${GITHUB_RUN_NUMBER}.0\"/; s/^application\/product_version=.*/application\/product_version=\"0.1.${GITHUB_RUN_NUMBER}.0\"/" export_presets.cfg
          grep -E "^version/|file_version|product_version" export_presets.cfg

      - name: Boot / auto-update smoke test
        run: |
          # 옛날 앱인 척 실행 → 직전 릴리스의 패치를 실제로 받아 적용해 본다
          ARCANA_UPDATE_TEST=1 timeout 120 ~/godot/godot --headless --path . --max-fps 60 --quit-after 1500 2>&1 | tee boot.log || true
          grep "부트 상태" boot.log || true
          if grep -E "SCRIPT ERROR|Parse Error" boot.log; then exit 1; fi

      - name: Export Windows (.exe)
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/ArcanaDuel.exe 2>&1 | grep -vE "Storing File|reimport|^\s*$" || true
          ls -la build/windows

      - name: Export Android (.apk)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-debug "Android" build/android/ArcanaDuel.apk 2>&1 | grep -vE "ADDING:|Storing File|reimport|^\s*$" || true
          ls -la build/android

      - name: Export patch packs (installed apps download these)
        run: |
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/patch_windows.pck 2>&1 | grep -vE "Storing File|reimport|^\s*$" || true
          ~/godot/godot --headless --path . --export-pack "Android" build/patch_android.pck 2>&1 | grep -vE "Storing File|reimport|^\s*$" || true
          cp data/version.json build/version.json
          ls -la build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcana-duel-${{ github.run_number }}
          path: |
            build/windows/ArcanaDuel.exe
            build/android/ArcanaDuel.apk
            sim.log
            ui.log
            online.log
            shots/*.png

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}
          name: 알파 빌드 ${{ github.run_number }}
          prerelease: false
          make_latest: "true"
          body: |
            자동 빌드입니다. (빌드 ${{ github.run_number }})
            - Windows: ArcanaDuel.exe 를 내려받아 실행 (경고가 뜨면 "추가 정보 → 실행")
            - Android: ArcanaDuel.apk 를 폰에서 내려받아 설치 ("출처를 알 수 없는 앱" 허용 필요)
            - 이미 설치된 앱(빌드 8 이상)은 켤 때 자동으로 업데이트돼요. (patch_*.pck, version.json 은 자동 업데이트용 파일)
          files: |
            build/windows/ArcanaDuel.exe
            build/android/ArcanaDuel.apk
            build/patch_windows.pck
            build/patch_android.pck
            build/version.json
            shots/*.png
