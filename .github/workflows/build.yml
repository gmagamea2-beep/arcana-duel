# 아르카나 듀얼 빌드: AI 자동 대전으로 규칙을 검사한 뒤 Windows .exe 와 Android .apk 를 만든다.
# GitHub 서버에서 실행되며, 공개 저장소는 무료다.
# 결과물은 실행 화면의 Artifacts 와 Releases(알파 빌드)에 올라간다.
name: Build EXE + APK

on:
  push:
    branches: [main, ccr-4c407fa2-hrzdcb]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project (script check)
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Rules test (AI vs AI simulation)
        run: |
          ~/godot/godot --headless --path . -s res://tests/sim.gd -- 300 2>&1 | tee sim.log
          if grep -E "SCRIPT ERROR|Parse Error|행동 실패:" sim.log; then exit 1; fi

      - name: UI test (play one game through the UI, screenshots)
        run: |
          mkdir -p shots && touch shots/.gdignore
          SHOT_DIR=$PWD/shots xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --path . --rendering-driver opengl3 --resolution 1920x1080 -s res://tests/ui_smoke.gd 2>&1 | tee ui.log
          if grep -E "SCRIPT ERROR|Parse Error|UI 행동 실패" ui.log; then exit 1; fi
          grep "UI 점검 완료" ui.log
          ls -la shots

      - name: Export Windows (.exe)
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/ArcanaDuel.exe 2>&1 | grep -vE "Storing File|reimport|^\s*$" || true
          ls -la build/windows

      - name: Export Android (.apk)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-debug "Android" build/android/ArcanaDuel.apk 2>&1 | grep -vE "ADDING:|Storing File|reimport|^\s*$" || true
          ls -la build/android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcana-duel-${{ github.run_number }}
          path: |
            build/windows/ArcanaDuel.exe
            build/android/ArcanaDuel.apk
            sim.log
            ui.log
            shots/*.png

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}
          name: 알파 빌드 ${{ github.run_number }}
          prerelease: true
          body: |
            자동 빌드입니다.
            - Windows: ArcanaDuel.exe 를 내려받아 실행 (경고가 뜨면 "추가 정보 → 실행")
            - Android: ArcanaDuel.apk 를 폰에서 내려받아 설치 ("출처를 알 수 없는 앱" 허용 필요)
          files: |
            build/windows/ArcanaDuel.exe
            build/android/ArcanaDuel.apk
            shots/*.png
